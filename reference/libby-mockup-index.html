function newResource(){editing='new';view='edit';render()}function editor(){let r=editing==='new'?{id:'',name:'',categories:[selected||'Pets'],summary:'',access:'',notes:'',phone:'',url:'',status:'RN-added; not yet verified',petAccess:'',verified:''}:db.resources.find(x=>x.id===editing);if(!r)return '<p>Record not found.</p>';let fields=[['name','Resource name'],['categories','Categories (separate with |)'],['summary','What it provides'],['access','How to access'],['notes','Field notes / barriers'],['phone','Phone'],['url','Website URL'],['petAccess','Pet access (blank if unknown)'],['status','Verification status'],['verified','Last checked (date or note)']];return `<div class="panel"><h2>${editing==='new'?'Add resource':'Edit resource'}</h2><p class="note">Changes are saved only in this browser. Export JSON to preserve or share updates. Avoid entering private client details or unpublished personal phone numbers.</p><form onsubmit="saveRecord(event)"><div class="editgrid">${fields.map(([k,label])=>`<label class="${['summary','access','notes'].includes(k)?'wide':''}">${label}${['summary','access','notes'].includes(k)?`<textarea name="${k}">${esc(k==='categories'?r.categories.join('|'):r[k])}</textarea>`:`<input name="${k}" value="${esc(k==='categories'?r.categories.join('|'):r[k])}" ${k==='name'?'required':''}>`}</label>`).join('')}</div><div class="actions"><button class="primary" type="submit">Save record</button><button type="button" onclick="go('lists',${JSON.stringify(selected).replaceAll('"','&quot;')})">Cancel</button>${editing!=='new'?`<button class="danger" type="button" onclick="deleteRecord('${r.id}')">Delete</button>`:''}</div></form></div>`}function saveRecord(e){e.preventDefault();let f=new FormData(e.target),r={};for(let [k,v] of f.entries())r[k]=String(v).trim();r.categories=r.categories.split('|').map(x=>x.trim()).filter(x=>cats().includes(x));if(!r.categories.length){alert('Choose at least one existing rubric category or Pets.');return}r.id=editing= function manage(){return `<div class="panel"><h2>Data management</h2><p>Resource edits are stored in this browser only. To share edits with other RNs, export JSON and send the file to the person maintaining the database. Shared multi-user editing requires hosting and a database backend.</p><div class="toolbar"><button class="primary" onclick="exportData()">Export updated JSON</button><button onclick="exportCSV()">Export resource CSV</button><button onclick="resetData()">Restore original draft</button></div><h3>Import a JSON database</h3><input type="file" accept=".json,application/json" onchange="importData(event)"><p class="small muted">Import replaces the current browser copy. Export your current version first.</p><div id="status"></div></div>`}function download(name,content,type){let blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('bff-resource-data.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let keys=['name','categories','summary','access','notes','phone','url','status','petAccess','verified'];let rows=[keys.join(','),...db.resources.map(r=>keys.map(k=>'"'+String(k==='categories'?r[k].join('|'):r[k]||'').replaceAll('"','""')+'"').join(','))];download('bff-resources.csv','\ufeff'+rows.join('\r\n'),'text/csv')}function importData(e){let file=e.target.files[0];if(!file)return;let fr=new FileReader();fr.onload=()=>{try{let v=JSON.parse(fr.result);if(!v.dimensions||!Array.isArray(v.resources))throw Error('Not a valid BFF database file');if(!confirm('Replace your local database with this file?'))return;db=v;save();go('rubric')}catch(err){alert(err.message)}};fr.readAsText(file)}function resetData(){if(!confirm('Discard browser edits and restore the packaged draft?'))return;db=JSON.parse(JSON.stringify(window.BFF_DATA));save();go('rubric')}

let gapEdit=null;
function buttons(){return [['rubric','Wellness Rubric'],['trees','Decision Trees'],['lists','Resource Lists'],['popups','Pop-Up Events'],['gaps','Gaps & Follow-ups'],['manage','Import / Export']].map(([v,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${t}</button>`).join('')}
function render(){ $('nav').innerHTML=buttons();let a=$('app');if(view==='rubric')a.innerHTML=rubric();if(view==='lists')a.innerHTML=lists();if(view==='trees')a.innerHTML=trees();if(view==='manage')a.innerHTML=manage();if(view==='gaps')a.innerHTML=gaps();if(view==='popups')a.innerHTML=popups();if(view==='edit')a.innerHTML=editor()}
function gaps(){let sections=[['gaps','Known service gaps'],['followups','Follow-up actions']];return `<div class="panel"><h2>Gaps & Follow-ups</h2><p class="muted">Working list. Avoid participant information or private contact details.</p>${sections.map(([key,label])=>`<section class="panel"><h3>${label}</h3>${(db[key]||[]).map((x,i)=>`<div class="resource"><b>${esc(x.title)}</b><p><b>Ideas:</b> ${esc(x.ideas||'—')}</p><p><b>Working on it:</b> ${esc(x.owner||'Unassigned')} · <b>Status:</b> ${esc(x.status||'Not started')}</p><button onclick="editGap('${key}',${i})">Edit</button></div>`).join('')}<button onclick="editGap('${key}',-1)">+ Add item</button></section>`).join('')}</div>${gapEdit?gapEditor():''}`}
function editGap(key,i){gapEdit={key,i};render();document.getElementById('gapEditor')?.scrollIntoView({behavior:'smooth'})}

function saveGapForm(e){e.preventDefault();let f=new FormData(e.target),obj={title:String(f.get('title')).trim(),ideas:String(f.get('ideas')).trim(),owner:String(f.get('owner')).trim(),status:String(f.get('status'))};if(!obj.title)return;let a=db[gapEdit.key];if(gapEdit.i<0)a.push(obj);else a[gapEdit.i]=obj;gapEdit=null;save();render()}
function deleteGap(){if(!gapEdit||!confirm('Delete this item?'))return;db[gapEdit.key].splice(gapEdit.i,1);gapEdit=null;save();render()}
function eventEnd(e){let stamp=(e.endDate||e.date)+'T'+(e.endTime||'23:59');let v=new Date(stamp);return isNaN(v.getTime())?null:v}

function eventCard(e,i){return `<article class="resource"><h3>${esc(e.name)}</h3><p><b>When:</b> ${esc(e.date)} ${esc(e.startTime||'')}–${esc(e.endTime||'')} ${e.endDate&&e.endDate!==e.date?' through '+esc(e.endDate):''}</p><p><b>Where:</b> ${esc(e.location||'Location not entered')}</p><p>${esc(e.services||'')}</p><p><b>Access:</b> ${esc(e.access||'Not documented')}</p><p><b>Lists:</b> ${esc((e.categories||[]).join(' · '))}</p><button onclick="popupEdit(${i})">Edit / duplicate</button></article>`}
let popupEditing=-1;
function popups(){db.popups=db.popups||[];let upcoming=db.popups.map((e,i)=>({e,i})).filter(x=>eventActive(x.e)).sort((a,b)=>a.e.date.localeCompare(b.e.date));let past=db.popups.map((e,i)=>({e,i})).filter(x=>!eventActive(x.e));return `<div class="panel"><h2>Pop-Up Events</h2><p class="muted">One-time resources appear on selected lists until their end time. Past events remain archived for reuse. This offline file uses your device clock.</p><button class="primary" onclick="popupEdit(-1)">+ Add pop-up event</button><h3>Upcoming / current</h3><div class="cards">${upcoming.map(x=>eventCard(x.e,x.i)).join('')||'<p class="muted">No upcoming events entered.</p>'}</div><h3>Past events</h3><div class="cards">${past.map(x=>eventCard(x.e,x.i)).join('')||'<p class="muted">No past events.</p>'}</div></div><div id="popupForm"></div>`}
function popupEdit(i,duplicate=false){popupEditing=duplicate?-1:i;let e=i<0?{}:db.popups[i];let form=`<section class="panel"><h3>${i<0?'Add':'Edit'} pop-up event</h3><form onsubmit="savePopup(event)"><div class="editgrid">${[['name','Event name','text'],['date','Start date','date'],['startTime','Start time','time'],['endDate','End date (optional)','date'],['endTime','End time','time'],['location','Location','text'],['services','Services offered','text'],['access','Eligibility, what to bring, access notes','text']].map(([k,label,type])=>`<label class="${['services','access'].includes(k)?'wide':''}">${label}<input name="${k}" type="${type}" value="${esc(e[k]||'')}" ${['name','date'].includes(k)?'required':''}></label>`).join('')}<label class="wide">Show on these resource lists (select multiple with Ctrl/Command)<select name="categories" multiple size="8">${cats().map(c=>`<option value="${esc(c)}" ${(e.categories||[]).includes(c)?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div><div class="actions"><button class="primary" type="submit">Save event</button><button type="button" onclick="popupEdit(${i},true)" ${i<0?'disabled':''}>Duplicate for another date</button><button type="button" onclick="render()">Cancel</button>${i>=0?`<button class="danger" type="button" onclick="deletePopup(${i})">Delete</button>`:''}</div></form></section>`;document.getElementById('popupForm').innerHTML=form;document.getElementById('popupForm').scrollIntoView({behavior:'smooth'})}
function savePopup(ev){ev.preventDefault();let f=new FormData(ev.target),obj={};for(let [k,v] of f.entries())obj[k]=String(v).trim();obj.categories=f.getAll('categories');if(!obj.categories.length){alert('Select at least one resource list.');return}db.popups=db.popups||[];if(popupEditing<0)db.popups.push(obj);else db.popups[popupEditing]=obj;save();render()}
